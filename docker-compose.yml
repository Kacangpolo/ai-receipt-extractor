services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: receipts
      POSTGRES_PASSWORD: receipts
      POSTGRES_DB: receipts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipts"]
      interval: 3s
      retries: 10

  extractor:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://receipts:receipts@db:5432/receipts
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    profiles: ["run"]   # only starts when you ask for it

volumes:
  pgdata:
